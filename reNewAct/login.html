<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef6ff 0%, #f7fbff 35%, #ffffff 100%);
    color: #333;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 36px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin-bottom: 40px;
  }
  .logo svg { width: 100%; height: 100%; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .form { width: 100%; }
  .input-box {
    width: 100%;
    height: 48px;
    background: #f0f2f5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 20px;
    transition: background .2s;
  }
  .input-box:focus-within { background: #e8eef7; }
  .input-box input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: #333;
  }
  .input-box input::placeholder { color: #b0b6c0; }
  .sms-box { padding: 0 0 0 20px; }
  .sms-divider {
    width: 1px;
    height: 22px;
    background: #d8dde5;
    margin: 0 4px;
    flex-shrink: 0;
  }
  .sms-btn {
    height: 100%;
    padding: 0 18px;
    border: none;
    background: transparent;
    color: #2b6cdf;
    font-size: 14px;
    cursor: pointer;
    border-radius: 0 24px 24px 0;
    white-space: nowrap;
    transition: color .2s;
  }
  .sms-btn:disabled {
    color: #b0b6c0;
    cursor: not-allowed;
  }
  .login-btn {
    width: 100%;
    height: 48px;
    line-height: 48px;
    text-align: center;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #4a90ff 0%, #2b6cdf 100%);
    border: none;
    border-radius: 24px;
    box-shadow: 0 6px 14px rgba(43, 108, 223, 0.3);
    cursor: pointer;
    margin-top: 8px;
    transition: transform .15s ease, opacity .2s;
  }
  .login-btn:active { transform: scale(0.98); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.78);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; }
  .loading-mask {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .loading-mask.show { display: flex; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #d6e4f7;
    border-top-color: #2b6cdf;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <img src="login_logo.png" alt="logo">
  </div>
  <div class="form">
    <div class="input-box">
      <input type="tel" id="phone" maxlength="11" placeholder="请输入手机号码" autocomplete="off">
    </div>
    <div class="input-box sms-box">
      <input type="tel" id="sms" maxlength="6" placeholder="请输入手机验证码" autocomplete="off">
      <span class="sms-divider"></span>
      <button class="sms-btn" id="smsBtn">获取验证码</button>
    </div>
    <button class="login-btn" id="loginBtn" disabled>登 录</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-mask" id="loading"><div class="spinner"></div></div>

<script>
  const ACT_ID = "GSYD001";
  const API_GET_SMS = "https://www.uool.cn/gsyd-act/getSms";
  const API_LOGIN  = "https://www.uool.cn/gsyd-act/login";

  const phoneEl = document.getElementById("phone");
  const smsEl   = document.getElementById("sms");
  const smsBtn  = document.getElementById("smsBtn");
  const loginBtn = document.getElementById("loginBtn");
  const loading = document.getElementById("loading");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2000);
  }
  function showLoading(show) {
    loading.classList.toggle("show", show);
  }
  function isValidPhone(p) { return /^1[3-9]\d{9}$/.test(p); }

  // 带超时的请求，避免接口无响应时一直加载
  function fetchWithTimeout(url, options, timeout) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(new Error("请求超时，请稍后重试")), timeout || 15000);
    return fetch(url, Object.assign({}, options, { signal: ctrl.signal }))
      .finally(() => clearTimeout(timer));
  }

  // 兼容服务端 GBK 编码：按响应头声明的 charset 解码后再解析 JSON
  //（fetch 的 resp.json() 固定按 UTF-8 解码，服务端返回 GBK 时会乱码）
  async function parseJsonResponse(resp) {
    const ct = resp.headers.get("content-type") || "";
    const m = /charset=([^;]+)/i.exec(ct);
    let charset = m ? m[1].trim().toLowerCase() : "utf-8";
    if (charset === "gb2312" || charset === "gbk" || charset === "gb18030") charset = "gbk";
    const buf = await resp.arrayBuffer();
    let text;
    try {
      text = new TextDecoder(charset).decode(buf);
    } catch (e) {
      text = new TextDecoder("utf-8").decode(buf);
    }
    return JSON.parse(text);
  }

  function updateLoginBtn() {
    loginBtn.disabled = !(isValidPhone(phoneEl.value) && smsEl.value.trim().length >= 4);
  }
  phoneEl.addEventListener("input", updateLoginBtn);
  smsEl.addEventListener("input", updateLoginBtn);

  // 获取验证码
  smsBtn.addEventListener("click", async () => {
    const phone = phoneEl.value.trim();
    if (!isValidPhone(phone)) { showToast("请输入正确的手机号码"); return; }
    if (smsBtn.disabled) return;

    smsBtn.disabled = true;
    let countdown = 60;
    smsBtn.textContent = countdown + "s 后重发";
    const timer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        smsBtn.textContent = "获取验证码";
        smsBtn.disabled = false;
      } else {
        smsBtn.textContent = countdown + "s 后重发";
      }
    }, 1000);

    try {
      const resp = await fetchWithTimeout(API_GET_SMS + "?actId=" + encodeURIComponent(ACT_ID) + "&phone=" + encodeURIComponent(phone), {
        method: "GET",
        headers: { "Accept": "application/json" }
      }, 15000);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const json = await parseJsonResponse(resp);
      if (json && (json.code === "200" || json.code === 200)) {
        showToast("验证码已发送，请注意查收");
      } else {
        showToast((json && json.msg) || "验证码发送失败");
      }
    } catch (e) {
      console.warn("getSms 接口获取失败：", e.message);
      showToast("验证码发送失败，请稍后重试");
    }
  });

  // 登录
  loginBtn.addEventListener("click", async () => {
    const phone = phoneEl.value.trim();
    const sms   = smsEl.value.trim();
    if (!isValidPhone(phone)) { showToast("请输入正确的手机号码"); return; }
    if (sms.length < 4) { showToast("请输入验证码"); return; }

    showLoading(true);
    try {
      const params = new URLSearchParams();
      params.append("actId", ACT_ID);
      params.append("phone", phone);
      params.append("sms", sms);
      const resp = await fetchWithTimeout(API_LOGIN + "?" + params.toString(), {
        method: "GET",
        headers: { "Accept": "application/json" }
      }, 15000);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const json = await parseJsonResponse(resp);
      if (json && (json.code === "200" || json.code === 200)) {
        const auth = {
          actId: ACT_ID,
          phone: phone,
          loginAt: Date.now()
        };
        localStorage.setItem("gsyd_auth", JSON.stringify(auth));
        showToast("登录成功");
        setTimeout(() => {
          location.href = "contractRenewal.html?actId=" + ACT_ID + "&phone=" + encodeURIComponent(phone);
        }, 600);
      } else {
        showLoading(false);
        showToast((json && json.msg) || "登录失败，请检查验证码");
      }
    } catch (e) {
      console.warn("login 接口获取失败：", e.message);
      showLoading(false);
      showToast("登录失败，请稍后重试");
    }
  });
</script>
</body>
</html>
